# Configuration H2 pour les tests (base de données en mémoire)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuration JPA/Hibernate pour H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Désactiver H2 console
spring.h2.console.enabled=false

# Désactiver le serveur web pour les tests
server.port=-1

# Désactiver les logs verbeux
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.context=WARN
logging.level.org.hibernate=WARN
logging.level.root=INFO

# Désactiver SpringDoc pour les tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
